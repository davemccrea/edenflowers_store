# Copy gitignored files from main (deps/, .env). _build/ is left out so a stale
# or half-compiled build in main can't leak in; each worktree compiles its own.
# images/uploads/ holds the customer photos pulled from production, which dev
# never serves.
[step.copy-ignored]
exclude = ["_build/", "images/uploads/"]

[[pre-start]]
copy = "wt step copy-ignored"

# Append worktree-specific DATABASE_NAME and PORT to this worktree's .env
[[pre-start]]
env = "bash -c 'echo >> .env && echo export DATABASE_NAME=edenflowers_{{ branch | sanitize_db }} >> .env && echo export PORT={{ branch | hash_port }} >> .env'"

# Fetch and compile any dependencies added/changed since the main worktree snapshot was copied
[[pre-start]]
deps = "bash -c 'source .env && mix deps.get && mix deps.compile'"

# Download translation locales
[[pre-start]]
locales = "bash -c 'source .env && mix localize.download_locales'"

# Create, migrate, and seed a per-worktree database
[[pre-start]]
db = "bash -c 'source .env && (mix ecto.drop --quiet 2>/dev/null; true) && mix ash.setup --quiet && mix run priv/repo/seeds.exs'"

# Drop this worktree's dev and test databases
[[pre-remove]]
db = "bash -c 'source .env && mix ecto.drop --quiet; MIX_ENV=test mix ecto.drop --quiet'"

# Stop this worktree's local imgproxy (see `just imgproxy`)
[[pre-remove]]
imgproxy = "bash -c 'source .env && docker rm -f edenflowers-imgproxy-$((PORT + 1)) >/dev/null 2>&1; true'"
