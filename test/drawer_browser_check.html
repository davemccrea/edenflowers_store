<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Drawer browser check</title>
  <!-- Run mix assets.build, then open this file in the browser under test. -->
  <link rel="stylesheet" href="../priv/static/assets/css/app.css">
  <body style="min-height: 200vh; padding-left: 44px; padding-right: 44px">
    <div id="hotfx-shy-header">Header</div>
    <pre id="result" style="margin-top: 12rem" role="status">Running…</pre>
    <dialog class="slide-drawer slide-drawer--right" aria-label="Test drawer">
      <div class="bg-base-200 flex h-full flex-col" style="width: 80vw">
        <button type="button">Focusable content</button>
      </div>
    </dialog>
    <script type="module">
      const dialog = document.querySelector("dialog");
      const result = document.querySelector("#result");
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const overflow = () => getComputedStyle(document.documentElement).overflowY;
      const assert = (condition, message) => { if (!condition) throw new Error(message); };
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      try {
        const header = document.querySelector("#hotfx-shy-header").getBoundingClientRect();
        assert(header.left === 0, "Header must stay viewport-aligned despite body padding");
        const originalOverflow = overflow();
        dialog.showModal();
        assert(overflow() === "hidden", "Opening must lock scrolling immediately");
        await wait(300);
        dialog.close();
        assert(overflow() === (reducedMotion ? originalOverflow : "hidden"), "Exit scroll lock must respect reduced motion");
        if (!reducedMotion) {
          assert(getComputedStyle(dialog).display !== "none", "Drawer must remain rendered for slide-out");
        }
        await wait(100);
        dialog.showModal();
        assert(overflow() === "hidden", "Reopening during exit must keep scrolling locked");
        await wait(300);
        assert(overflow() === "hidden", "An earlier close must not unlock a reopened drawer");
        dialog.close();
        overflow();
        await wait(350);
        assert(overflow() === originalOverflow, "Scrolling must unlock after exit");
        assert(getComputedStyle(dialog).display === "none", "Drawer must be hidden after exit");
        result.textContent = `PASS (reduced motion: ${reducedMotion})`;
      } catch (error) {
        dialog.close();
        result.textContent = `FAIL: ${error.message}`;
        throw error;
      }
    </script>
  </body>
</html>
