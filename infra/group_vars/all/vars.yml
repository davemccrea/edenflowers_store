ansible_python_interpreter: /usr/bin/python3

# Project
project_name: edenflowers_store # Should match Phoenix project name / GitHub project name
user: david

# App
project_url: edenflowers.fi
maintenance_mode: true
image_tag: latest
app_port: 4000
secret_key_base: "{{ vault_secret_key_base }}"
token_signing_secret: "{{ vault_token_signing_secret }}"
release_cookie: "{{ vault_release_cookie }}"

# Database
db_name: "{{ project_name }}_prod"
db_user: "{{ vault_db_user }}"
db_password: "{{ vault_db_password }}"
database_url: "ecto://{{ db_user }}:{{ db_password }}@localhost:5432/{{ db_name }}"

# GitHub
github_username: davemccrea
github_token: "{{ vault_github_token }}"
github_actions_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFHR1/KrPvby/MpfjDv9sM6X9zRMyrAVXNqVpcYzGJDm github-actions"

# Tailscale
tailscale_hostname: edenflowers-server
tailscale_authkey: "{{ vault_tailscale_authkey }}"

# Stripe
stripe_secret_key: "{{ vault_stripe_secret_key }}"
stripe_publishable_key: "{{ vault_stripe_publishable_key }}"
stripe_webhook_secret: "{{ vault_stripe_webhook_secret }}"

# Here
here_api_key: "{{ vault_here_api_key }}"

# Mapbox
mapbox_token: "{{ vault_mapbox_token }}"

# imgproxy
imgproxy_prefix: https://images.edenflowers.fi
imgproxy_key: "{{ vault_imgproxy_key }}"
imgproxy_salt: "{{ vault_imgproxy_salt }}"

# Cloudflare
cloudflare_tunnel_token: "{{ vault_cloudflare_tunnel_token }}"

# Papra
papra_base_url: "https://papra.edenflowers.fi"
papra_auth_secret: "{{ vault_papra_auth_secret }}"
papra_api_key: "{{ vault_papra_api_key }}"
papra_webhook_secret: "{{ vault_papra_webhook_secret }}"
papra_organization_id: "{{ vault_papra_organization_id }}"

# Weblate (separate Compose project and Cloudflare Tunnel)
weblate_domain: translate.edenflowers.fi
weblate_image: weblate/weblate:2026.10.1.4
weblate_postgres_image: postgres:18-alpine
weblate_valkey_image: valkey/valkey:9.1.3
weblate_network_subnet: 172.30.50.0/24
weblate_network_dynamic_range: 172.30.50.128/25
weblate_tunnel_address: 172.30.50.2
weblate_cloudflared_image: cloudflare/cloudflared:latest
weblate_cloudflare_tunnel_token: "{{ vault_weblate_cloudflare_tunnel_token }}"
weblate_admin_name: David
weblate_admin_email: "{{ error_alert_email }}"
weblate_db_password: "{{ vault_weblate_db_password }}"
weblate_smtp_user: "{{ vault_brevo_smtp_user }}"
weblate_smtp_password: "{{ vault_brevo_smtp_password }}"

# Anthropic
anthropic_api_key: "{{ vault_anthropic_api_key }}"

# Email (Brevo)
brevo_api_key: "{{ vault_brevo_api_key }}"
mailer_from_name: Jennie
mailer_from_email: info@edenflowers.fi
brevo_newsletter_list_id: "4"
error_alert_email: mail@dmccrea.me
shop_notice_email: info@edenflowers.fi

# Web Push for admin order notifications
vapid_public_key: "BN4aYz2NjwKIBK5pDPWGMPlW3QWeWTP2eBTJaFnra0IBZ0EW4A16OeSrEjdnRUescacckmA3CW5amnYsj4aJZbM"
vapid_private_key: "{{ vault_vapid_private_key }}"
