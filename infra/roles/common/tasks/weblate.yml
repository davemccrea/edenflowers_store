---
- name: Check Weblate secrets
  ansible.builtin.assert:
    that:
      - weblate_db_password | default('') | length >= 32
      - weblate_smtp_user | default('') | length > 0
      - weblate_smtp_password | default('') | length > 0
      - weblate_cloudflare_tunnel_token | default('') | length > 0
    fail_msg: Add the Weblate database password, Brevo SMTP credentials and dedicated Cloudflare Tunnel token to Ansible Vault before provisioning.
  no_log: true

- name: Create Weblate directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/weblate, owner: root, mode: "0700" }
    - { path: /opt/weblate/data, owner: "1000", mode: "0700" }
    - { path: /opt/weblate/backups, owner: root, mode: "0700" }

- name: Place Weblate Compose configuration
  ansible.builtin.template:
    src: weblate-compose.yml.j2
    dest: /opt/weblate/docker-compose.yml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Recreate Weblate

- name: Place Weblate backup script
  ansible.builtin.template:
    src: weblate-backup.sh.j2
    dest: /opt/weblate/backup.sh
    owner: root
    group: root
    mode: "0700"

- name: Schedule Weblate backups
  ansible.builtin.cron:
    name: Backup Weblate database and repositories
    hour: "3"
    minute: "0"
    user: root
    job: /opt/weblate/backup.sh
