---
- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    install_python_debian: true

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check Tailscale status
  ansible.builtin.command:
    cmd: tailscale status --json
  register: common_tailscale_status
  changed_when: false
  failed_when: false

- name: Parse Tailscale status
  ansible.builtin.set_fact:
    common_tailscale_current_hostname: "{{ (common_tailscale_status.stdout | from_json).Self.HostName | default('') }}"
    common_tailscale_online: "{{ (common_tailscale_status.stdout | from_json).Self.Online | default(false) }}"
  when: common_tailscale_status.rc == 0 and common_tailscale_status.stdout != ''

- name: Bring Tailscale up
  ansible.builtin.command:
    cmd: tailscale up --authkey={{ tailscale_authkey }} --hostname={{ tailscale_hostname }} --accept-dns=false
  register: common_tailscale_up
  changed_when: common_tailscale_up.rc == 0 and common_tailscale_up.stderr != ''
  no_log: true
  when: >
    common_tailscale_status.rc != 0
    or not common_tailscale_online | default(false)
    or common_tailscale_current_hostname | default('') != tailscale_hostname

- name: Allow traffic on tailscale0 interface
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
