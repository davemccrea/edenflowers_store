---
- name: Create app and images directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    mode: "0755"
  loop:
    - "/opt/{{ project_name }}"
    - "/opt/{{ project_name }}/images"

# The app container runs as Debian's nobody (65534) and writes admin photo
# uploads here; imgproxy reads them through the images mount.
- name: Create photo uploads directory
  ansible.builtin.file:
    path: "/opt/{{ project_name }}/images/uploads"
    state: directory
    owner: "65534"
    mode: "0755"

- name: Fix images permissions every 5 minutes
  ansible.builtin.cron:
    name: "Fix imgproxy image permissions"
    minute: "*/5"
    job: "find /opt/{{ project_name }}/images -type f -exec chmod 644 {} \\; 2>/dev/null"
    user: root

# Created once and never overwritten, so provisioning keeps whatever
# `just maintenance` or the Maintenance workflow last set.
- name: Create maintenance.env
  ansible.builtin.copy:
    content: "MAINTENANCE_MODE=false\n"
    dest: "/opt/{{ project_name }}/maintenance.env"
    owner: "{{ user }}"
    mode: "0644"
    force: false

- name: Create Caddy directories
  ansible.builtin.file:
    path: "/opt/{{ project_name }}/caddy/site/images"
    state: directory
    owner: "{{ user }}"
    mode: "0755"

- name: Place Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "/opt/{{ project_name }}/caddy/Caddyfile"
    owner: "{{ user }}"
    mode: "0644"
  notify: Restart caddy

# Caddy serves these while the app is down, so it can't fetch them from the app.
- name: Place the page shown while the app restarts
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/opt/{{ project_name }}/caddy/site/{{ item.dest }}"
    owner: "{{ user }}"
    mode: "0644"
  loop:
    - { src: caddy/updating.html, dest: updating.html }
    - { src: "{{ playbook_dir }}/../priv/static/images/logo-eden-flowers-wide.svg", dest: images/logo-eden-flowers-wide.svg }

- name: Place docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/opt/{{ project_name }}/docker-compose.yml"
    owner: "{{ user }}"
    mode: "0644"
  notify: Recreate container
