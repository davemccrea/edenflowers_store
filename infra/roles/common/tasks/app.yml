---
- name: Create app and images directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    mode: "0755"
  loop:
    - "/opt/{{ project_name }}"
    - "/opt/{{ project_name }}/images"

# The app container runs as Debian's nobody (65534) and writes admin photo
# uploads here; imgproxy reads them through the images mount.
- name: Create photo uploads directory
  ansible.builtin.file:
    path: "/opt/{{ project_name }}/images/uploads"
    state: directory
    owner: "65534"
    mode: "0755"

- name: Fix images permissions every 5 minutes
  ansible.builtin.cron:
    name: "Fix imgproxy image permissions"
    minute: "*/5"
    job: "find /opt/{{ project_name }}/images -type f -exec chmod 644 {} \\; 2>/dev/null"
    user: root

# Created once and never overwritten, so provisioning keeps whatever
# `just maintenance` or the Maintenance workflow last set.
- name: Create maintenance.env
  ansible.builtin.copy:
    content: "MAINTENANCE_MODE=false\n"
    dest: "/opt/{{ project_name }}/maintenance.env"
    owner: "{{ user }}"
    mode: "0644"
    force: false

- name: Place docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/opt/{{ project_name }}/docker-compose.yml"
    owner: "{{ user }}"
    mode: "0644"
  notify: Recreate container
