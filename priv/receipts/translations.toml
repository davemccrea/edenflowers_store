# Receipt label translations. Mirrors the laskutys translation shape so
# the keys are familiar to anyone reading both projects.
#
# The Elixir caller sets `lang` in the JSON payload based on `order.locale`
# ("sv-FI" → "sv", "fi-FI" → "fi", else "en").

