name: Translation PR

on:
  push:
    branches: [weblate-translations]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: translation-pr
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open PR if translations changed
        shell: bash
        run: |
          set -euo pipefail

          if ! gh api "repos/$GH_REPO/git/ref/heads/weblate-translations" --silent; then
            echo "Translation branch is unavailable. Push translations from Weblate first."
            exit 1
          fi

          changed_files=$(gh api "repos/$GH_REPO/compare/main...weblate-translations" --jq '.files | length')
          if [ "$changed_files" -eq 0 ]; then
            echo "No changes to merge."
            exit 0
          fi

          existing_pr=$(gh pr list --base main --head weblate-translations --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "Translation updates are included in PR #$existing_pr."
            exit 0
          fi

          gh pr create \
            --base main \
            --head weblate-translations \
            --title "chore(l10n): update translations" \
            --body "Translations maintained in Weblate.

          Review terminology, placeholders, plural forms, and CI before merging. For email translations, also run mix print_emails and review every language.

          Further Weblate pushes update this PR automatically. Merge and deployment remain manual."
