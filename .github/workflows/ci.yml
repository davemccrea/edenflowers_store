name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edenflowers_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost/edenflowers_test
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      # Pinned to match the Dockerfile so receipt rendering is deterministic
      # across CI and prod. Bump both together.
      - name: Install Typst
        env:
          TYPST_VERSION: 0.14.2
        run: |
          curl --fail-with-body -sSL \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin \
              "typst-x86_64-unknown-linux-musl/typst"
          typst --version

      # Pre-fetch @preview packages so the first real render's stderr stays
      # quiet — Receipt.generate captures stdout for PDF bytes, and a cold
      # cache prints download progress to stderr.
      - name: Warm Typst package cache
        run: typst compile priv/receipts/_warmup.typ /tmp/warmup.pdf

      - name: Restore deps and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-mix-${{ env.MIX_ENV }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix localize.download_locales
      - run: mix compile --warnings-as-errors
      - run: mix ecto.create
      - run: mix ecto.migrate
      - run: mix test
