name: Auto-update PR branches

on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update open non-draft PRs targeting main
        env:
          GH_TOKEN: ${{ secrets.PR_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list \
            --base main \
            --state open \
            --json number,isDraft \
            --jq '.[] | select(.isDraft == false) | .number')

          if [ -z "$prs" ]; then
            echo "No open non-draft PRs to update."
            exit 0
          fi

          for pr in $prs; do
            echo "Updating PR #$pr"
            if ! gh pr update-branch "$pr" 2>&1; then
              echo "::warning::Failed to update PR #$pr (likely merge conflict or already current)"
            fi
          done
